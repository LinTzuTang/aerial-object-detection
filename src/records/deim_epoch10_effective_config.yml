task: detection
evaluator:
  type: CocoEvaluator
  iou_types:
  - bbox
num_classes: 10
remap_mscoco_category: false
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /content/cvpdl_postprocess/dataset/images/train
    ann_file: /content/cvpdl_postprocess/deimv2_l/train_numeric.json
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: RandomPhotometricDistort
        p: 0.3
      - type: RandomIoUCrop
        p: 0.3
      - type: RandomHorizontalFlip
        p: 0.5
      - type: Resize
        size:
        - 1280
        - 1280
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: ConvertPILImage
        dtype: float32
        scale: true
      - type: Normalize
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
      - type: ConvertBoxes
        fmt: cxcywh
        normalize: true
      policy:
        name: stop_epoch
        epoch: 10000
        ops:
        - RandomPhotometricDistort
        - RandomIoUCrop
  shuffle: true
  num_workers: 2
  drop_last: false
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 1280
    base_size_repeat: null
    mixup_prob: 0.0
    copyblend_prob: 0.0
    stop_epoch: 16
  total_batch_size: 1
  pin_memory: true
val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /content/cvpdl_postprocess/dataset/images/val
    ann_file: /content/cvpdl_postprocess/deimv2_l/val_numeric.json
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: Resize
        size:
        - 1280
        - 1280
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: ConvertPILImage
        dtype: float32
        scale: true
      - type: Normalize
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
      - type: ConvertBoxes
        fmt: cxcywh
        normalize: true
  shuffle: false
  num_workers: 2
  drop_last: false
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 1280
    base_size_repeat: null
    mixup_prob: 0.0
    copyblend_prob: 0.0
    stop_epoch: 16
  total_batch_size: 1
  pin_memory: true
print_freq: 500
output_dir: ./outputs/deimv2_dinov3_l_coco
checkpoint_freq: 5
sync_bn: true
find_unused_parameters: true
use_amp: true
scaler:
  type: GradScaler
  enabled: true
use_ema: true
ema:
  type: ModelEMA
  decay: 0.9998
  warmups: 500
  start: 0
epoches: 68
clip_max_norm: 0.1
optimizer:
  type: AdamW
  params:
  - params: ^(?=.*.dinov3)(?!.*(?:norm|bn|bias)).*$
    lr: 1.25e-05
  - params: ^(?=.*.dinov3)(?=.*(?:norm|bn|bias)).*$
    lr: 1.25e-05
    weight_decay: 0.0
  - params: ^(?=.*(?:sta|encoder|decoder))(?=.*(?:norm|bn|bias)).*$
    weight_decay: 0.0
  lr: 0.0005
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.000125
lr_scheduler:
  type: MultiStepLR
  milestones:
  - 500
  gamma: 0.1
lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 500
model: DEIM
criterion: DEIMCriterion
postprocessor: PostProcessor
use_focal_loss: true
eval_spatial_size:
- 1280
- 1280
DEIM:
  backbone: DINOv3STAs
  encoder: HybridEncoder
  decoder: DEIMTransformer
HGNetv2:
  name: B4
  return_idx:
  - 1
  - 2
  - 3
  freeze_at: -1
  freeze_stem_only: true
  freeze_norm: false
  pretrained: true
  local_model_dir: ./weight/hgnetv2/
HybridEncoder:
  in_channels:
  - 224
  - 224
  - 224
  feat_strides:
  - 8
  - 16
  - 32
  hidden_dim: 224
  use_encoder_idx:
  - 2
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 896
  dropout: 0.0
  enc_act: gelu
  expansion: 1.0
  depth_mult: 1
  act: silu
  version: deim
  csp_type: csp2
  fuse_op: sum
DEIMTransformer:
  feat_channels:
  - 224
  - 224
  - 224
  feat_strides:
  - 8
  - 16
  - 32
  hidden_dim: 224
  num_levels: 3
  num_layers: 4
  eval_idx: -1
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 4
  layer_scale: 1
  num_points:
  - 3
  - 6
  - 3
  cross_attn_method: default
  query_select_method: default
  activation: silu
  mlp_act: silu
  dim_feedforward: 1792
PostProcessor:
  num_top_queries: 300
lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 2000
flat_epoch: 34
no_aug_epoch: 8
DEIMCriterion:
  weight_dict:
    loss_mal: 1
    loss_bbox: 5
    loss_giou: 2
    loss_fgl: 0.15
    loss_ddf: 1.5
  losses:
  - mal
  - boxes
  - local
  gamma: 1.5
  alpha: 0.75
  reg_max: 32
  matcher:
    type: HungarianMatcher
    weight_dict:
      cost_class: 2
      cost_bbox: 5
      cost_giou: 2
    alpha: 0.25
    gamma: 2.0
    change_matcher: true
    iou_order_alpha: 4.0
    matcher_change_epoch: 10000
DINOv3STAs:
  name: dinov3_vits16
  weights_path: null
  interaction_indexes:
  - 5
  - 8
  - 11
  finetune: true
  conv_inplane: 32
  hidden_dim: 224
